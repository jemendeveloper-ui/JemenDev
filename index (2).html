<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CATCH & RIDE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 12px;

    font-family: Arial Black, Arial, Helvetica, sans-serif;

    background:
        linear-gradient(135deg, #159dcc, #55d5ee, #159dcc);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


/* =========================================================
   MAIN POSTER
========================================================= */

.poster {
    position: relative;

    width: 100%;
    max-width: 1450px;
    min-height: 950px;

    overflow: hidden;

    border-radius: 45px;
    border: 5px solid rgba(255,255,255,.7);

    background:
        linear-gradient(
            180deg,
            #79def7 0%,
            #54c8ec 45%,
            #35aeda 100%
        );

    box-shadow:
        0 30px 70px rgba(0,0,0,.30),
        inset 0 0 60px rgba(255,255,255,.18);
}


/* =========================================================
   PIXEL GRID EFFECT
========================================================= */

.poster::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: .12;

    background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);

    background-size: 12px 12px;

    z-index: 2;
}


/* =========================================================
   SUN
========================================================= */

.sun {
    position: absolute;

    width: 145px;
    height: 145px;

    top: 45px;
    right: 22%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffed5,
            #fff04d 40%,
            #ffc928 75%,
            #ffae00
        );

    box-shadow:
        0 0 25px #fff5a0,
        0 0 70px rgba(255,230,80,.8);

    z-index: 3;

    animation: sunFloat 4s ease-in-out infinite;
}

@keyframes sunFloat {
    50% {
        transform: translateY(8px);
    }
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud {
    position: absolute;

    width: 230px;
    height: 55px;

    border-radius: 50px;

    background: white;

    box-shadow:
        0 8px 15px rgba(0,0,0,.10);

    z-index: 5;

    animation: cloudFloat 8s ease-in-out infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background: white;
}

.cloud::before {
    width: 85px;
    height: 85px;

    left: 25px;
    bottom: 0;
}

.cloud::after {
    width: 105px;
    height: 105px;

    right: 25px;
    bottom: 0;
}

.cloud1 {
    left: 38%;
    top: 75px;
}

.cloud2 {
    right: 5%;
    top: 170px;

    transform: scale(.8);

    animation-delay: 2s;
}

@keyframes cloudFloat {
    50% {
        transform: translateX(25px);
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: relative;

    z-index: 20;

    margin-top: 70px;

    text-align: center;

    filter:
        drop-shadow(0 15px 12px rgba(0,0,0,.20));
}

.catch {
    font-size: clamp(58px, 10vw, 150px);

    font-weight: 1000;

    letter-spacing: 4px;

    color: #ffffff;

    line-height: .9;

    text-shadow:
        0 5px 0 #e0e0e0,
        0 9px 0 #bcbcbc,
        0 13px 0 #999999,
        0 20px 25px rgba(0,0,0,.25);

    animation: titleFloat 3s ease-in-out infinite;
}

.ride {
    margin-top: 8px;

    font-size: clamp(58px, 10vw, 145px);

    font-weight: 1000;

    letter-spacing: 4px;

    line-height: .9;

    color: #71f52b;

    text-shadow:
        0 5px 0 #54c218,
        0 9px 0 #3c970d,
        0 13px 0 #287707,
        0 20px 25px rgba(0,0,0,.25);
}

.amp {
    display: inline-block;

    color: #fff35b;

    font-size: .72em;

    margin: 0 8px;

    text-shadow:
        0 4px 0 #d5b900,
        0 8px 0 #a38d00,
        0 14px 20px rgba(0,0,0,.25);

    transform: rotate(-5deg);

    animation: ampBounce 2s ease-in-out infinite;
}

@keyframes ampBounce {
    50% {
        transform: translateY(-7px) rotate(5deg);
    }
}

@keyframes titleFloat {
    50% {
        transform: translateY(-3px);
    }
}


/* =========================================================
   FOX
========================================================= */

.fox {
    position: absolute;

    left: 12%;
    top: 315px;

    width: 260px;
    height: 190px;

    z-index: 30;

    filter:
        drop-shadow(0 15px 8px rgba(0,0,0,.25));

    animation: foxBounce 3s ease-in-out infinite;
}

@keyframes foxBounce {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-10px) rotate(-2deg);
    }
}

.fox-ear {
    position: absolute;

    top: -45px;

    width: 90px;
    height: 105px;

    background:
        linear-gradient(
            135deg,
            #ff8b22,
            #e84900
        );

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.fox-ear.left {
    left: 20px;
    transform: rotate(-15deg);
}

.fox-ear.right {
    right: 20px;
    transform: rotate(15deg);
}

.fox-ear::after {
    content: "";

    position: absolute;

    left: 28px;
    top: 25px;

    width: 34px;
    height: 55px;

    background: #ffd1c0;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.fox-head {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 260px;
    height: 165px;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #ff861c,
            #e94c00
        );

    box-shadow:
        inset 0 -15px rgba(130,40,0,.2),
        inset 0 8px rgba(255,255,255,.15);
}

.fox-face {
    position: absolute;

    width: 215px;
    height: 125px;

    left: 50%;
    bottom: -5px;

    transform: translateX(-50%);

    background: white;

    border-radius: 50%;

    box-shadow:
        inset 0 -8px rgba(0,0,0,.08);
}

.fox-forehead {
    position: absolute;

    width: 105px;
    height: 85px;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    background: #ff7110;

    clip-path:
        polygon(
            50% 0,
            100% 100%,
            0 100%
        );
}

.fox-eye {
    position: absolute;

    top: 72px;

    width: 29px;
    height: 38px;

    border-radius: 50%;

    background: #111;

    box-shadow:
        inset 6px 4px rgba(255,255,255,.25);
}

.fox-eye.left {
    left: 42px;
}

.fox-eye.right {
    right: 42px;
}

.fox-nose {
    position: absolute;

    width: 46px;
    height: 35px;

    left: 50%;
    bottom: 13px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: #111;
}


/* =========================================================
   PANDA
========================================================= */

.panda {
    position: absolute;

    right: 9%;
    top: 285px;

    width: 190px;
    height: 215px;

    z-index: 30;

    filter:
        drop-shadow(0 15px 9px rgba(0,0,0,.25));

    animation: pandaBounce 3.5s ease-in-out infinite;
}

@keyframes pandaBounce {
    0%,100% {
        transform: translateY(0) rotate(7deg);
    }

    50% {
        transform: translateY(-10px) rotate(3deg);
    }
}

.panda-body {
    position: absolute;

    left: 25px;
    bottom: 0;

    width: 140px;
    height: 170px;

    background:
        linear-gradient(#fff,#e9e9e9);

    border-radius: 45%;

    box-shadow:
        inset -10px -10px rgba(0,0,0,.08);
}

.panda-arm {
    position: absolute;

    top: 50px;

    width: 52px;
    height: 120px;

    border-radius: 50px;

    background:
        linear-gradient(
            #444,
            #222
        );
}

.panda-arm.left {
    left: 0;
    transform: rotate(20deg);
}

.panda-arm.right {
    right: 0;
    transform: rotate(-20deg);
}

.panda-head {
    position: absolute;

    left: 5px;
    top: -70px;

    width: 170px;
    height: 150px;

    border-radius: 50%;

    background:
        linear-gradient(
            #fff,
            #eeeeee
        );

    box-shadow:
        inset -8px -8px rgba(0,0,0,.08);
}

.panda-ear {
    position: absolute;

    top: -3px;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background:
        linear-gradient(#444,#222);
}

.panda-ear.left {
    left: 5px;
}

.panda-ear.right {
    right: 5px;
}

.panda-patch {
    position: absolute;

    top: 47px;

    width: 48px;
    height: 60px;

    border-radius: 50%;

    background: #333;
}

.panda-patch.left {
    left: 25px;
    transform: rotate(25deg);
}

.panda-patch.right {
    right: 25px;
    transform: rotate(-25deg);
}

.panda-eye {
    position: absolute;

    width: 16px;
    height: 20px;

    top: 20px;
    left: 16px;

    border-radius: 50%;

    background: white;
}

.panda-nose {
    position: absolute;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    width: 30px;
    height: 22px;

    border-radius: 50%;

    background: #111;
}


/* =========================================================
   EXTRA PIXEL DECORATIONS
========================================================= */

.pixel {
    position: absolute;

    z-index: 8;

    width: 12px;
    height: 12px;

    background: rgba(255,255,255,.65);

    box-shadow:
        20px 8px rgba(255,255,255,.4),
        40px -5px rgba(255,255,255,.55),
        10px 28px rgba(255,255,255,.3);
}

.pixel1 {
    top: 240px;
    left: 6%;
}

.pixel2 {
    top: 150px;
    left: 20%;
    transform: scale(.7);
}

.pixel3 {
    top: 270px;
    right: 25%;
    transform: scale(.8);
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {
    position: relative;

    z-index: 45;

    width: 90%;
    max-width: 900px;

    margin: 185px auto 0;

    padding: 18px 25px;

    text-align: center;

    color: #ffffff;

    font-size: clamp(17px, 2.4vw, 32px);

    font-weight: 1000;

    line-height: 1.4;

    text-shadow:
        0 3px 0 #197c9d,
        0 6px 8px rgba(0,0,0,.35);

    background:
        rgba(0,120,170,.18);

    border: 3px solid rgba(255,255,255,.35);

    border-radius: 22px;

    backdrop-filter: blur(3px);
}


/* =========================================================
   COMING SOON
========================================================= */

.coming {
    position: relative;

    z-index: 45;

    width: fit-content;

    margin: 25px auto 0;

    padding: 10px 25px;

    border-radius: 22px;

    background:
        linear-gradient(
            #8cff4a,
            #50d617
        );

    border: 4px solid #3ca50d;

    color: white;

    font-size: clamp(38px, 6vw, 80px);

    font-weight: 1000;

    text-shadow:
        0 5px #318c0b,
        0 9px 15px rgba(0,0,0,.25);

    box-shadow:
        0 8px #318c0b,
        0 15px 25px rgba(0,0,0,.22);

    animation: coming 2s ease-in-out infinite;
}

@keyframes coming {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }
}


/* =========================================================
   DISCORD
========================================================= */

.discord {
    position: relative;

    z-index: 50;

    width: 90%;
    max-width: 1000px;

    min-height: 135px;

    margin: 30px auto 40px;

    padding: 18px 35px;

    display: flex;

    align-items: center;

    text-decoration: none;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #807df8,
            #514bd5
        );

    border: 4px solid #3932a4;

    box-shadow:
        0 9px 0 #30278b,
        0 18px 30px rgba(0,0,0,.28);

    transition:
        transform .2s ease,
        filter .2s ease;
}

.discord:hover {
    transform: translateY(-6px) scale(1.01);
    filter: brightness(1.1);
}

.discord:active {
    transform: translateY(3px);
}

.discord-icon {
    width: 90px;
    height: 90px;

    margin-right: 25px;

    flex-shrink: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #9694ff,
            #625fe4
        );

    box-shadow:
        inset 0 5px rgba(255,255,255,.2),
        0 8px 12px rgba(0,0,0,.2);
}

.discord-logo {
    position: relative;

    width: 60px;
    height: 45px;

    border-radius:
        17px
        17px
        22px
        22px;

    background: white;
}

.discord-logo::before {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    top: 17px;
    left: 12px;

    border-radius: 50%;

    background: #5c5be0;

    box-shadow:
        25px 0 #5c5be0;
}

.discord-logo::after {
    content: "";

    position: absolute;

    left: 7px;
    bottom: -8px;

    width: 23px;
    height: 18px;

    background: white;

    clip-path:
        polygon(
            0 0,
            100% 0,
            0 100%
        );
}

.discord-title {
    color: white;

    font-size: clamp(22px, 3vw, 43px);

    font-weight: 1000;

    text-shadow:
        0 4px 5px rgba(0,0,0,.25);
}

.discord-link {
    margin-top: 5px;

    color: #e2e3ff;

    font-size: clamp(14px, 2vw, 25px);

    font-weight: 800;

    text-shadow:
        0 2px 3px rgba(0,0,0,.2);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {
        padding: 6px;
    }

    .poster {
        min-height: 820px;
        border-radius: 28px;
    }

    .title {
        margin-top: 55px;
    }

    .catch {
        font-size: 55px;
        letter-spacing: 2px;
    }

    .ride {
        font-size: 58px;
    }

    .amp {
        margin: 0 3px;
    }

    .sun {
        width: 75px;
        height: 75px;

        top: 35px;
        right: 8%;
    }

    .cloud1 {
        left: 30%;
        top: 55px;
        transform: scale(.43);
    }

    .cloud2 {
        right: -18%;
        top: 130px;
        transform: scale(.43);
    }

    .fox {
        left: 1%;
        top: 205px;

        transform: scale(.46);

        transform-origin: left top;
    }

    .panda {
        right: -2%;
        top: 195px;

        transform: scale(.44);

        transform-origin: right top;
    }

    .description {
        margin-top: 125px;

        width: 88%;

        padding: 12px 14px;

        font-size: 15px;

        line-height: 1.45;
    }

    .coming {
        margin-top: 18px;

        font-size: 36px;

        padding: 8px 15px;
    }

    .discord {
        width: 92%;

        min-height: 92px;

        margin-top: 25px;
        margin-bottom: 30px;

        padding: 10px 12px;

        border-radius: 20px;
    }

    .discord-icon {
        width: 60px;
        height: 60px;

        margin-right: 12px;

        border-radius: 15px;
    }

    .discord-logo {
        transform: scale(.65);
    }

    .discord-title {
        font-size: 17px;
    }

    .discord-link {
        font-size: 11px;
    }

    .pixel {
        transform: scale(.6);
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 400px) {

    .poster {
        min-height: 760px;
    }

    .catch {
        font-size: 45px;
    }

    .ride {
        font-size: 49px;
    }

    .fox {
        top: 190px;
        transform: scale(.39);
        transform-origin: left top;
    }

    .panda {
        top: 180px;
        transform: scale(.37);
        transform-origin: right top;
    }

    .description {
        margin-top: 105px;
        font-size: 12px;
    }

    .coming {
        font-size: 29px;
    }

    .discord-title {
        font-size: 14px;
    }

    .discord-link {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="poster">

    <!-- SKY -->
    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <!-- PIXEL DECORATIONS -->
    <div class="pixel pixel1"></div>
    <div class="pixel pixel2"></div>
    <div class="pixel pixel3"></div>


    <!-- TITLE -->
    <div class="title">

        <div class="catch">
            CATCH
            <span class="amp">&amp;</span>
        </div>

        <div class="ride">
            RIDE
        </div>

    </div>


    <!-- FOX -->
    <div class="fox">

        <div class="fox-ear left"></div>
        <div class="fox-ear right"></div>

        <div class="fox-head">

            <div class="fox-forehead"></div>

            <div class="fox-face">

                <div class="fox-eye left"></div>
                <div class="fox-eye right"></div>

                <div class="fox-nose"></div>

            </div>

        </div>

    </div>


    <!-- PANDA -->
    <div class="panda">

        <div class="panda-body">

            <div class="panda-arm left"></div>
            <div class="panda-arm right"></div>

            <div class="panda-head">

                <div class="panda-ear left"></div>
                <div class="panda-ear right"></div>

                <div class="panda-patch left">
                    <div class="panda-eye"></div>
                </div>

                <div class="panda-patch right">
                    <div class="panda-eye"></div>
                </div>

                <div class="panda-nose"></div>

            </div>

        </div>

    </div>


    <!-- DESCRIPTION -->
    <div class="description">

        Catch pets, ride them, earn money, upgrade
        your treadmill, and work your way toward
        better pets.

    </div>


    <!-- COMING SOON -->
    <div class="coming">
        COMING SOON!!
    </div>


    <!-- DISCORD -->
    <a
        class="discord"
        href="https://discord.gg/S5B9CG2ysA"
        target="_blank"
        rel="noopener noreferrer"
    >

        <div class="discord-icon">
            <div class="discord-logo"></div>
        </div>

        <div class="discord-content">

            <div class="discord-title">
                JOIN OUR DISCORD!
            </div>

            <div class="discord-link">
                discord.gg/S5B9CG2ysA
            </div>

        </div>

    </a>

</div>

</body>
</html>
